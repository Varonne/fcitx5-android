name: Nix Build, Cloud Sign & Upload

on:
  push:

jobs:
  develop:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch source code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v17
        with:
          name: fcitx5-android
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      # 1. 仅编译 arm64-v8a
      - name: Build Release APKs (arm64-v8a)
        run: |
          nix develop .#noAS --command ./gradlew :app:assembleRelease :assembleReleasePlugins -Pandroid.injected.build.abi=arm64-v8a

      # 2. 签名文件
      - name: Generate Keystore on Cloud
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias mykey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=GitHub Actions, OU=Dev, O=Dev, L=Dev, ST=Dev, C=CN"

      # 3. 使用 apksigner 统一签名
      - name: Sign APKs
        run: |
          # 寻找最新的 apksigner
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          
          echo "Signing main app..."
          find app/build/outputs/apk/release/ -name "*.apk" | while read apk; do
            $APKSIGNER sign --ks release.jks --ks-pass pass:123456 --key-pass pass:123456 --ks-key-alias mykey "$apk"
          done
          
          echo "Signing plugins..."
          find plugin -path "*/build/outputs/apk/release/*.apk" | while read apk; do
            $APKSIGNER sign --ks release.jks --ks-pass pass:123456 --key-pass pass:123456 --ks-key-alias mykey "$apk"
          done

      # 4. 上传 App 产物
      - name: Upload App APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-arm64-v8a-${{ github.run_number }}
          path: app/build/outputs/apk/release/
          if-no-files-found: error
          retention-days: 30

      # 5. 收集并上传插件产物
      - name: Pack plugins
        shell: bash
        run: |
          mkdir -p plugins-to-upload
          for i in $(ls plugin)
          do
            if [ -d "plugin/${i}/build/outputs/apk/release" ]
            then
              cp -r "plugin/${i}/build/outputs/apk/release" "plugins-to-upload/${i}"
            fi
          done

      - name: Upload Plugins
        uses: actions/upload-artifact@v4
        with:
          name: plugins-release-arm64-v8a-${{ github.run_number }}
          path: plugins-to-upload/
          if-no-files-found: warn
          retention-days: 30
